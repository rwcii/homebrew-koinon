name: Formula
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: present
        shell: bash
        run: |
          if [ -f Formula/koinon.rb ]; then echo "formula=true" >> "$GITHUB_OUTPUT"; else echo "No formula yet."; fi
      - if: steps.present.outputs.formula == 'true'
        uses: Homebrew/actions/setup-homebrew@main
      - if: steps.present.outputs.formula == 'true'
        run: |
          brew install --formula rwcii/koinon/koinon
          brew test rwcii/koinon/koinon
          brew audit --strict --online rwcii/koinon/koinon
          koinon version
